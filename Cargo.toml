[package]
name = "rustypac"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "RustyPac"
path = "src/main.rs"

[dependencies]
bytehaul = "=0.2.0"
tokio = { version = "1", features = ["rt-multi-thread", "signal"] }
unicode-width = "0.2"
terminal_size = "0.4"
libc = "0.2"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "2.1", default-features = false, features = ["serialize", "deserialize"] }
tempfile = "3"
