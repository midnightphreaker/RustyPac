[package]
name = "rustypac"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "RustyPac"
path = "src/main.rs"

[dependencies]
bytehaul = "=0.2.0"
tokio = { version = "1", features = ["rt-multi-thread", "signal"] }
unicode-width = "0.2"
terminal_size = "0.4"
libc = "0.2"
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"
